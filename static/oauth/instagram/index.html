<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>OAuth 콜백 · Instagram</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
         max-width: 680px; margin: 0 auto; padding: 48px 20px; line-height: 1.6; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .svc { font-size: 13px; opacity: .6; margin-bottom: 28px; }
  .box { border: 1px solid rgba(128,128,128,.35); border-radius: 10px; padding: 16px; margin: 18px 0; }
  .label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; opacity: .6; margin-bottom: 8px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px;
         word-break: break-all; display: block; }
  button { font: inherit; padding: 9px 18px; border-radius: 8px; border: 1px solid rgba(128,128,128,.45);
           background: transparent; color: inherit; cursor: pointer; }
  button:hover { background: rgba(128,128,128,.12); }
  .ok { color: #128a3d; font-weight: 600; }
  .err { color: #c0362c; font-weight: 600; }
  .hint { font-size: 13px; opacity: .7; }
</style>
</head>
<body>
<h1>OAuth 콜백</h1>
<div class="svc">Instagram</div>
<div id="out"></div>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  var out = document.getElementById('out');
  var err = p.get('error');

  if (err) {
    out.innerHTML = '<p class="err">인증이 취소되었거나 실패했습니다.</p>'
      + '<div class="box"><div class="label">error</div><code>'
      + esc(err) + '</code></div>'
      + '<p class="hint">' + esc(p.get('error_description') || '') + '</p>';
    return;
  }

  var code = p.get('code');
  if (!code) {
    out.innerHTML = '<p class="hint">인가 코드가 없습니다. 인증 URL부터 다시 시작하세요.</p>';
    return;
  }
  code = code.replace(/#_$/, '').replace(/#$/, '');

  // ── 자동 중계 ───────────────────────────────────────────────
  // GitHub Pages 는 정적이라 코드를 직접 못 받는다. 그래서 받은 쿼리 전체를
  // VPS 의 Tailscale Funnel 로 넘긴다(state 포함). 성공하면 오너는 아무것도
  // 안 눌러도 된다. 실패하면 아래의 손복사 UI 가 그대로 남는다 —
  // VPS 가 꺼져 있거나 Funnel 이 내려가 있을 때가 그 경우다.
  var RELAY = 'https://hermes-vps.tailb2fdeb.ts.net/ig/relay';
  out.innerHTML = '<p class="hint">서버로 전달하는 중…</p>';
  var done = false;
  var t = setTimeout(function () { if (!done) { done = true; manual(); } }, 8000);
  fetch(RELAY + location.search, { mode: 'cors', cache: 'no-store' })
    .then(function (r) { return r.ok ? r.text() : Promise.reject(r.status); })
    .then(function () {
      if (done) return; done = true; clearTimeout(t);
      out.innerHTML = '<p class="ok">완료됐습니다. 이 창은 닫으셔도 됩니다.</p>'
        + '<p class="hint">토큰 교환·저장·검증은 서버가 이어서 합니다.</p>';
    })
    .catch(function () { if (!done) { done = true; clearTimeout(t); manual(); } });
  return;

  function manual() {

  out.innerHTML = '<p class="ok">인증 성공. 아래 코드를 복사해 서버에서 토큰으로 교환하세요.</p>'
    + '<div class="box"><div class="label">authorization code</div><code id="c">' + esc(code) + '</code></div>'
    + '<button id="bu">주소 전체 복사 (권장)</button> <button id="b">코드만 복사</button>'
    + ' <span id="m" class="hint"></span>'
    + '<p class="hint" style="margin-top:14px">「주소 전체 복사」를 쓰면 서버가 <code style="display:inline">state</code> 까지 검증합니다. '
    + '코드만 넘기면 이 인가가 우리가 시작한 것인지 확인할 방법이 없습니다.</p>'
    + '<p class="hint" style="margin-top:14px">⚠️ 이 코드는 <b>1시간 동안, 단 한 번만</b> 사용할 수 있습니다.</p>';

  // 🔴 주소 전체가 기본이다. code 만 넘기면 서버가 state 를 대조할 수 없어서,
  //    우리가 시작하지 않은 인가 결과를 그대로 삼키게 된다(CSRF).
  function copy(text, okMsg) {
    var m = document.getElementById('m');
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
      .then(function () { m.textContent = okMsg; },
            function () { m.textContent = '복사 실패 — 아래 글자를 직접 선택해 복사하세요'; });
  }
  document.getElementById('bu').onclick = function () { copy(location.href, '주소 복사됨'); };
  document.getElementById('b').onclick = function () { copy(code, '코드 복사됨'); };

  }

  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
})();
</script>
</body>
</html>
