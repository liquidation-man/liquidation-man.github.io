# ------------------------------------------------------------
#  코드 하이라이트 / 마크다운
# ------------------------------------------------------------
[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"
  [markup.goldmark.renderer]
    unsafe = true   # 글 안에 광고/HTML(In-article AdSense) 삽입 허용
