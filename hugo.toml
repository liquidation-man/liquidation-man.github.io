# ============================================================
#  부업 자동화 개발일지 — Hugo + PaperMod 설정
#  이 값들 중 배포/수익화 관련은 ../config.yaml 에서 파생되며,
#  Publisher가 필요 시 이 파일을 갱신할 수 있다.
# ============================================================

baseURL = "https://liquidation-man.github.io/"
locale = "ko-kr"
defaultContentLanguage = "ko"
title = "부업 자동화 개발일지"
theme = "PaperMod"

enableRobotsTXT = true       # robots.txt 자동 생성 (sitemap 링크 포함)
enableInlineShortcodes = true
enableEmoji = true
hasCJKLanguage = true        # 한국어 단어수/요약 계산 정확도
buildDrafts = false
buildFuture = false
buildExpired = false

pluralizeListTitles = false
summaryLength = 70

[pagination]
  pagerSize = 10

[minify]
  disableXML = true
  minifyOutput = true

# 홈에 검색(JSON)·RSS 출력 활성화
[outputs]
  home = ["HTML", "RSS", "JSON"]

# ------------------------------------------------------------
#  측정 — Google Analytics 4
# ------------------------------------------------------------
# ⚠️ **빈 값으로 둔다. 가짜 placeholder 를 넣지 마라.**
#    Hugo 내장 파셜이 `with` 로 감싸 출력하므로 빈 값이면 스크립트가 아예 나가지
#    않는다. 반대로 `G-XXXXXXXXXX` 같은 가짜 값을 넣으면 실제 사이트에 잘못된
#    ID 로 gtag 가 실려서, 측정은 안 되는데 광고 차단기·정책 검사만 걸린다.
#
#    받는 곳: analytics.google.com → 관리(⚙) → 데이터 스트림 → 웹 스트림 선택
#             → 오른쪽 위 '측정 ID' (형식: G-XXXXXXXXXX)
#    넣는 곳: 아래 ID = "" 의 따옴표 안.
[services]
  [services.googleAnalytics]
    ID = ""

# ------------------------------------------------------------
#  PaperMod 파라미터
# ------------------------------------------------------------
[params]
  env = "production"          # sitemap/GA/구조화데이터 등 프로덕션 기능 on
  title = "부업 자동화 개발일지"
  description = "매일 여러 프로젝트를 자동화하며 배운 것들을 기록합니다 — 트레이딩 봇, 유튜브, 게임, AI까지. 개발 자동화 파이프라인이 사람 개입 없이 써 내려가는 일지."
  keywords = ["개발일지", "자동화", "부업", "파이썬", "Hugo", "GitHub Actions", "트레이딩봇", "유튜브자동화", "게임개발", "AI"]
  author = "liquidation-man"
  DateFormat = "2006년 1월 2일"
  mainSections = ["posts"]    # 홈·RSS·검색이 대상으로 삼는 주요 섹션

  defaultTheme = "auto"       # 다크/라이트 자동 (모바일 시스템 설정 따라감)
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowToc = true
  TocOpen = false
  ShowRssButtonInSectionTermList = true
  ShowFullTextinRSS = false
  comments = false
  hidemeta = false
  hideSummary = false

  # --- AdSense (승인 후 ../config.yaml 의 adsense.client_id 만 채우면 활성) ---
  # 이 값이 비어 있으면 광고 스크립트가 삽입되지 않는다.
  adsenseClientId = ""

  # --- 검색엔진 소유확인 (PaperMod 내장 처리, 고정 커밋 154d006e 에서 확인) ---
  #
  # ⚠️ 여기도 **빈 값으로 둔다.** 테마가 `if` 로 감싸므로 빈 값이면 meta 태그가
  #    출력되지 않는다. 가짜 값을 넣으면 태그는 나가는데 소유확인은 실패하고,
  #    그 상태로는 등록 절차를 다시 밟아야 한다.
  #
  # ⚠️ 넣는 것은 **meta 태그 전체가 아니라 content 값 하나**다.
  #    받은 것이 <meta name="google-site-verification" content="abc123" /> 라면
  #    넣을 값은 abc123 뿐이다. 태그째 붙이면 HTML 이 깨진다.
  [params.analytics]
    [params.analytics.google]
      # Google Search Console → 속성 추가 → URL 접두어
      #   https://liquidation-man.github.io/ → 소유권 확인 → 'HTML 태그' 방식
      SiteVerificationTag = ""
    [params.analytics.naver]
      # 네이버 서치어드바이저(searchadvisor.naver.com) → 웹마스터도구
      #   → 사이트 등록 → 소유확인 → 'HTML 태그' 방식
      SiteVerificationTag = ""
    [params.analytics.bing]
      # Bing 웹마스터도구(bing.com/webmasters). Search Console 에서 가져오기를
      # 쓰면 소유확인 없이 등록되므로 대개 이 값은 비워 둬도 된다.
      SiteVerificationTag = ""

  # 홈 상단 인사말 (프로필 모드 대신 심플한 인트로)
  [params.homeInfoParams]
    Title = "부업 자동화 개발일지 👋"
    Content = "여러 사이드 프로젝트(자동매매 봇, 유튜브 콘텐츠 자동화, 로그라이크 게임, AI 인플루언서 등)를 매일 조금씩 넓혀가며, 그날 무엇을 왜 어떻게 했는지 자동으로 기록합니다. 이 글들은 파이프라인이 사람 손 없이 씁니다."

  [params.assets]
    disableHLJS = true
    favicon = "/favicon.ico"
    apple_touch_icon = "/apple-touch-icon.png"

  # SEO/공유용 소셜 아이콘 (RSS만 우선; 나머지는 계정 생기면 추가)
  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/liquidation-man"

